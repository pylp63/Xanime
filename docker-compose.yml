services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: xanime-app
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - DB_DRIVER=sqlite3
      - DB_PATH=/app/data/xanime.db
      - VIDEO_PATH=/app/videos
      - STATIC_PATH=/app/static
      - DIST_PATH=/app/dist
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin}
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
      - PORT=8080
      - GIN_MODE=${GIN_MODE:-release}
    volumes:
      - xanime_data:/app/data
      - ${VIDEO_PATH:-./videos}:/app/videos
      - ${STATIC_PATH:-./static}:/app/static
      # 统一存储入口: 宿主机 /data/Xanime 内可放真实目录或软链(NFS/NAS 先挂到宿主机
      # /mnt 再 ln -s 到 /data/Xanime), 新增存储无需修改 compose 重启容器。
      - /data/Xanime:/data/Xanime
      # NFS/NAS 宿主机挂载区(只读透传, 软链目标可达)。
      - /mnt:/mnt:ro
    restart: unless-stopped

volumes:
  xanime_data:
